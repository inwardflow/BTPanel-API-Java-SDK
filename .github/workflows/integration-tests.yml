name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      run_reason:
        description: "Why are you running integration tests?"
        required: false
        default: "manual validation"

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    environment: integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate required integration secrets
        shell: bash
        env:
          BT_PANEL_BASE_URL: ${{ secrets.BT_PANEL_BASE_URL }}
          BT_PANEL_API_KEY: ${{ secrets.BT_PANEL_API_KEY }}
        run: |
          if [ -z "$BT_PANEL_BASE_URL" ]; then
            echo "Missing required secret: BT_PANEL_BASE_URL"
            exit 1
          fi
          if [ -z "$BT_PANEL_API_KEY" ]; then
            echo "Missing required secret: BT_PANEL_API_KEY"
            exit 1
          fi

      - name: Run integration profile
        env:
          ENABLE_INTEGRATION_TESTS: "true"
          BT_PANEL_BASE_URL: ${{ secrets.BT_PANEL_BASE_URL }}
          BT_PANEL_API_KEY: ${{ secrets.BT_PANEL_API_KEY }}
          BT_PANEL_TEST_DB_NAME: ${{ secrets.BT_PANEL_TEST_DB_NAME }}
          BT_PANEL_TEST_DB_USER: ${{ secrets.BT_PANEL_TEST_DB_USER }}
          BT_PANEL_TEST_DB_PASSWORD: ${{ secrets.BT_PANEL_TEST_DB_PASSWORD }}
          BT_PANEL_TEST_FILE_PATH: ${{ secrets.BT_PANEL_TEST_FILE_PATH }}
          BT_PANEL_TEST_FTP_ROOT: ${{ secrets.BT_PANEL_TEST_FTP_ROOT }}
          BT_PANEL_TEST_DOMAIN_SUFFIX: ${{ secrets.BT_PANEL_TEST_DOMAIN_SUFFIX }}
          BT_PANEL_TEST_WEBROOT_BASE: ${{ secrets.BT_PANEL_TEST_WEBROOT_BASE }}
          BT_PANEL_TEST_SSL_CERT_COMMON_NAME: ${{ secrets.BT_PANEL_TEST_SSL_CERT_COMMON_NAME }}
          BT_PANEL_TEST_SSL_CERT_DOMAINS: ${{ secrets.BT_PANEL_TEST_SSL_CERT_DOMAINS }}
          BT_PANEL_VERIFY_SSL: ${{ secrets.BT_PANEL_VERIFY_SSL }}
          BT_PANEL_CONNECT_TIMEOUT: ${{ secrets.BT_PANEL_CONNECT_TIMEOUT }}
          BT_PANEL_READ_TIMEOUT: ${{ secrets.BT_PANEL_READ_TIMEOUT }}
          BT_PANEL_RETRY_COUNT: ${{ secrets.BT_PANEL_RETRY_COUNT }}
        run: ./mvnw -B -ntp verify -Pintegration-tests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
